name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot or recording helps a lot.
    validations:
      required: true
  - type: input
    attributes:
      label: OpenZip version
      description: Settings → About
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 27.2, MacBook Pro (M5 Max)"
    validations:
      required: true
  - type: input
    attributes:
      label: What kind of archive is it?
      description: The format, roughly how large, whether it has a password or is split into volumes. If you can share the archive, or one that shows the same problem, attach it.
      placeholder: "A 2 GB .7z with a password, made with 7-Zip on Windows"
